[package]
name = "pyago"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.3", features = ["derive"] }
toml = "0.7"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde_json = "1.0"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
indicatif = "0.17.0"
env_logger = "0.10"
log = "0.4"
rich = "0.0.0"
